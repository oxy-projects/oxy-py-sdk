[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oxy-py-sdk"
version = "1.0.2"
description = "Python utilities for HTTP, configuration, cryptography, and data processing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["http", "configuration", "cryptography", "utilities"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
requires-python = ">=3.15"
authors = [
  { name = "wangjz", email = "wangjz_vip@163.com" }
]
# 基础工具仅使用标准库；功能依赖按需安装。
dependencies = []

[project.optional-dependencies]
codec = [
  # 密码学：DES 等对称算法用 pycryptodome；RSA/签名用 cryptography。
  "pycryptodome>=3.23.0",
  "cryptography>=49.0.0",
]
data = [
  "pandas>=3.0.3",
  "openpyxl>=3.1.5",
]
http = [
  # HTTP请求库。
  "httpx[http2]>=0.28.1",
  # 类型约束，数据校验。
  "pydantic>=2.13.4",
]
setting = [
  # YAML 解析库。
  "pyyaml>=6.0.3",
]
# 全部
all = [
  # 终端颜色输出库。可以让命令行输出带颜色，比如错误显示红色、成功显示绿色。
  "colorama>=0.4.6",
  "oxy-py-sdk[codec,data,http,setting]",
]

[project.urls]
Homepage = "https://github.com/oxy-projects/oxy-py-sdk"
Repository = "https://github.com/oxy-projects/oxy-py-sdk"
Issues = "https://github.com/oxy-projects/oxy-py-sdk/issues"
Changelog = "https://github.com/oxy-projects/oxy-py-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pandas-stubs>=3.0.5.260730",
  "pytest>=8.0",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oxy"]
